name: buildffi

# Manual cloud build of minimal libmpv-2.dll (VS/MSVC ABI + clang, x64).
# No push/PR auto trigger.
on:
  workflow_dispatch:

concurrency:
  group: buildffi-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  win-x64-msvc:
    runs-on: windows-2025
    env:
      CC: ccache clang
      CXX: ccache clang++
      CC_LD: lld-link
      CXX_LD: lld-link
      WINDRES: llvm-rc
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Disable autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - name: Get time
        id: get_time
        shell: pwsh
        run: |
          "timestamp=$((Get-Date).Ticks)" >> $env:GITHUB_OUTPUT

      - name: Restore caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            ffi-prefix
            subprojects/libvpl
            subprojects/shaderc_cmake
          key: buildffi-x64-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            buildffi-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja
          winget install --accept-source-agreements --accept-package-agreements NASM.NASM Ccache.Ccache --disable-interactivity
          # Real pkg-config binary required by meson-ports FFmpeg (pip pkgconf is not enough)
          choco install pkgconfiglite -y --no-progress
          echo "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Verify pkg-config
        shell: pwsh
        run: |
          $pc = Get-Command pkg-config -ErrorAction Stop
          Write-Host "pkg-config: $($pc.Source)"
          pkg-config --version

      - name: Update Meson WrapDB (harfbuzz stack for libass)
        shell: pwsh
        run: |
          meson wrap update-db
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib
          meson wrap install freetype2
          meson wrap install fribidi

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Could not find a Visual Studio installation with MSVC" }
          "VS=$vsPath" | Tee-Object -FilePath $env:GITHUB_ENV -Append

      - name: Build FFI libmpv
        id: build
        shell: pwsh
        run: |
          # Match upstream win32 CI: drop conflicting toolchains, keep VS LLVM clang
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          # Job-level CC/CXX/CC_LD already set; reaffirm after DevShell
          $env:CC = "ccache clang"
          $env:CXX = "ccache clang++"
          $env:CC_LD = "lld-link"
          $env:CXX_LD = "lld-link"
          $env:WINDRES = "llvm-rc"
          clang --version
          pkg-config --version
          ./ci/build-win32-ffi.ps1

      - name: Print meson log on failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: pwsh
        run: |
          $log = Get-ChildItem -Recurse -Filter "meson-log.txt" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'build-ffi' } |
            Select-Object -First 1
          if ($log) {
            Write-Host "==== meson-log.txt (tail) ===="
            Get-Content $log.FullName -Tail 250
          }

      - name: Verify exports
        shell: pwsh
        run: |
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $dll = Join-Path $PWD "ffi-out\libmpv-2.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          $exports = & dumpbin.exe /EXPORTS $dll | Out-String
          foreach ($sym in @('mpv_create','mpv_initialize','mpv_command','mpv_set_property','mpv_get_property','mpv_wait_event','mpv_terminate_destroy')) {
            if ($exports -notmatch [regex]::Escape($sym)) {
              throw "Missing export: $sym"
            }
            Write-Host "OK export: $sym"
          }
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache -s
          }

      - name: Artifact name
        id: artifact
        shell: pwsh
        run: |
          $name = "libmpv-2-win-x64-msvc-${{ github.run_id }}"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ffi-out/*
            !ffi-out/*.pdb
          if-no-files-found: error

      - name: Save caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .ccache
            ffi-prefix
            subprojects/libvpl
            subprojects/shaderc_cmake
          key: buildffi-x64-${{ steps.get_time.outputs.timestamp }}
