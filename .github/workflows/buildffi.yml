name: buildffi

# Manual only. All build steps are cmd.exe (no PowerShell build script).
on:
  workflow_dispatch:

concurrency:
  group: buildffi-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  win-x64-msvc:
    runs-on: windows-2025
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: cmd
    steps:
      - name: Disable autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - name: Get time
        id: get_time
        run: |
          echo timestamp=%RANDOM%%RANDOM%%TIME: =0%>> %GITHUB_OUTPUT%

      - name: Restore caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            ffi-prefix
            subprojects/libvpl
            subprojects/shaderc_cmake
            subprojects/spirv-cross-src
            subprojects/ffmpeg
          key: buildffi-x64-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            buildffi-x64-

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja
          winget install --accept-source-agreements --accept-package-agreements NASM.NASM Ccache.Ccache --disable-interactivity
          choco install pkgconfiglite -y --no-progress
          echo %LOCALAPPDATA%\Microsoft\WinGet\Links>> %GITHUB_PATH%
          echo C:\Program Files\NASM>> %GITHUB_PATH%
          where pkg-config
          pkg-config --version
          where meson
          where ninja
          where nasm

      - name: Find Visual Studio
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            echo VS=%%i>> %GITHUB_ENV%
            echo Found VS=%%i
            set "VS_FOUND=%%i"
          )
          if not defined VS_FOUND (
            echo ERROR: Visual Studio not found
            exit /b 1
          )

      - name: Prepare wraps and dirs
        run: |
          if not exist subprojects mkdir subprojects
          if not exist ffi-prefix mkdir ffi-prefix
          if not exist ffi-prefix\lib\pkgconfig mkdir ffi-prefix\lib\pkgconfig
          if not exist ffi-out mkdir ffi-out

          rem shaderc + spirv-cross are prebuilt with MSVC cl into ffi-prefix (not meson cmake wraps)

          > subprojects\ffmpeg.wrap echo [wrap-git]
          >> subprojects\ffmpeg.wrap echo url = https://gitlab.freedesktop.org/gstreamer/meson-ports/ffmpeg.git
          >> subprojects\ffmpeg.wrap echo revision = meson-8.1
          >> subprojects\ffmpeg.wrap echo depth = 1
          >> subprojects\ffmpeg.wrap echo clone-recursive = true
          >> subprojects\ffmpeg.wrap echo [provide]
          >> subprojects\ffmpeg.wrap echo dependency_names = libavcodec, libavdevice, libavfilter, libavformat, libavutil, libswresample, libswscale
          >> subprojects\ffmpeg.wrap echo program_names = ffmpeg

          > subprojects\libass.wrap echo [wrap-git]
          >> subprojects\libass.wrap echo url = https://github.com/libass/libass
          >> subprojects\libass.wrap echo revision = master
          >> subprojects\libass.wrap echo depth = 1
          >> subprojects\libass.wrap echo clone-recursive = true

          > subprojects\libplacebo.wrap echo [wrap-git]
          >> subprojects\libplacebo.wrap echo url = https://code.videolan.org/videolan/libplacebo.git
          >> subprojects\libplacebo.wrap echo revision = master
          >> subprojects\libplacebo.wrap echo depth = 1
          >> subprojects\libplacebo.wrap echo clone-recursive = true

          meson wrap update-db
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib
          meson wrap install freetype2
          meson wrap install fribidi

      - name: Build libvpl with MSVC cl
        run: |
          call "%VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "PATH=C:\Program Files\NASM;%PATH%"

          rem Force classic MSVC for libvpl — clang+lld breaks on -Wl,-z,relro
          set CC=cl
          set CXX=cl
          set CC_LD=
          set CXX_LD=
          set LD=
          set LDFLAGS=
          set CFLAGS=
          set CXXFLAGS=

          if not exist subprojects\libvpl (
            git clone --depth 1 --branch v2.17.0 https://github.com/intel/libvpl.git subprojects\libvpl
          )

          if not exist ffi-prefix\bin\libvpl.dll (
            if exist subprojects\libvpl-build rmdir /s /q subprojects\libvpl-build
            mkdir subprojects\libvpl-build
            cmake -S subprojects\libvpl -B subprojects\libvpl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%CD%\ffi-prefix -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DBUILD_SHARED_LIBS=ON -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF
            if errorlevel 1 exit /b 1
            cmake --build subprojects\libvpl-build --config Release
            if errorlevel 1 exit /b 1
            cmake --install subprojects\libvpl-build --config Release
            if errorlevel 1 exit /b 1
          )

          rem Always rewrite .pc so restored cache works on a new runner workspace path
          python ci\ffi\write-vpl-pc.py
          if errorlevel 1 exit /b 1

          set PKG_CONFIG_PATH=%CD%\ffi-prefix\lib\pkgconfig
          pkg-config --exists --print-errors vpl
          if errorlevel 1 exit /b 1
          pkg-config --cflags --libs vpl
          dir ffi-prefix\bin\libvpl.dll
          dir ffi-prefix\lib\vpl.lib

      - name: Build shaderc with MSVC cl
        run: |
          call "%VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "PATH=C:\Program Files\NASM;%PATH%"
          set CC=cl
          set CXX=cl
          set CC_LD=
          set CXX_LD=

          if not exist subprojects\shaderc_cmake (
            git clone --depth 1 https://github.com/google/shaderc subprojects\shaderc_cmake
            git -C subprojects\shaderc_cmake apply --ignore-whitespace "%CD%\ci\ffi\shaderc-glslang.patch"
          )

          rem Cache hit: libs already in ffi-prefix
          if exist ffi-prefix\lib\shaderc_combined.lib goto :write_pc
          if exist ffi-prefix\lib\shaderc.lib goto :write_pc

          python subprojects\shaderc_cmake\utils\git-sync-deps
          if errorlevel 1 exit /b 1
          python subprojects\shaderc_cmake\third_party\spirv-tools\utils\update_build_version.py subprojects\shaderc_cmake\third_party\spirv-tools\CHANGES subprojects\shaderc_cmake\third_party\spirv-tools\build-version.inc
          if errorlevel 1 exit /b 1

          if exist subprojects\shaderc-build rmdir /s /q subprojects\shaderc-build
          cmake -S subprojects\shaderc_cmake -B subprojects\shaderc-build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%CD%\ffi-prefix ^
            -DCMAKE_INSTALL_LIBDIR=lib ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DSHADERC_SKIP_TESTS=ON ^
            -DSHADERC_SKIP_EXAMPLES=ON ^
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON ^
            -DENABLE_GLSLANG_BINARIES=OFF ^
            -DSKIP_GLSLANG_INSTALL=ON ^
            -DENABLE_SPVREMAPPER=OFF ^
            -DSPIRV_SKIP_EXECUTABLES=ON ^
            -DSPIRV_SKIP_TESTS=ON ^
            -DSPIRV_WERROR=OFF
          if errorlevel 1 exit /b 1
          cmake --build subprojects\shaderc-build --config Release
          if errorlevel 1 exit /b 1
          cmake --install subprojects\shaderc-build --config Release
          if errorlevel 1 exit /b 1

          :write_pc
          python ci\ffi\write-shaderc-pc.py
          if errorlevel 1 exit /b 1
          set PKG_CONFIG_PATH=%CD%\ffi-prefix\lib\pkgconfig
          pkg-config --exists --print-errors shaderc
          if errorlevel 1 exit /b 1
          pkg-config --cflags --libs shaderc

      - name: Build spirv-cross with MSVC cl
        run: |
          call "%VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set CC=cl
          set CXX=cl
          set CC_LD=
          set CXX_LD=

          if not exist subprojects\spirv-cross-src (
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross subprojects\spirv-cross-src
          )

          if exist ffi-prefix\lib\spirv-cross-c.lib goto :write_pc

          if exist subprojects\spirv-cross-build rmdir /s /q subprojects\spirv-cross-build
          cmake -S subprojects\spirv-cross-src -B subprojects\spirv-cross-build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%CD%\ffi-prefix ^
            -DCMAKE_INSTALL_LIBDIR=lib ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ^
            -DSPIRV_CROSS_SHARED=OFF ^
            -DSPIRV_CROSS_STATIC=ON ^
            -DSPIRV_CROSS_CLI=OFF ^
            -DSPIRV_CROSS_ENABLE_TESTS=OFF ^
            -DSPIRV_CROSS_ENABLE_MSL=OFF ^
            -DSPIRV_CROSS_ENABLE_CPP=OFF ^
            -DSPIRV_CROSS_ENABLE_REFLECT=OFF ^
            -DSPIRV_CROSS_ENABLE_UTIL=OFF ^
            -DSPIRV_CROSS_ENABLE_C_API=ON ^
            -DSPIRV_CROSS_ENABLE_GLSL=ON ^
            -DSPIRV_CROSS_ENABLE_HLSL=ON
          if errorlevel 1 exit /b 1
          cmake --build subprojects\spirv-cross-build --config Release
          if errorlevel 1 exit /b 1
          cmake --install subprojects\spirv-cross-build --config Release
          if errorlevel 1 exit /b 1

          :write_pc
          python ci\ffi\write-spirv-cross-pc.py
          if errorlevel 1 exit /b 1
          set PKG_CONFIG_PATH=%CD%\ffi-prefix\lib\pkgconfig
          pkg-config --exists --print-errors spirv-cross-c-shared
          if errorlevel 1 exit /b 1
          pkg-config --cflags --libs spirv-cross-c-shared
          if exist ffi-prefix\include\spirv_cross\spirv_cross_c.h (
            dir ffi-prefix\include\spirv_cross\spirv_cross_c.h
          ) else if exist ffi-prefix\include\spirv_cross_c.h (
            dir ffi-prefix\include\spirv_cross_c.h
          ) else (
            echo spirv_cross_c.h missing after install
            dir /s /b ffi-prefix\include\*spirv*
            exit /b 1
          )

      - name: Meson setup and compile libmpv
        id: build
        run: |
          call "%VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          rem x64 only: put VS LLVM clang BEFORE standalone LLVM; keep full PATH intact
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%VS%\VC\Tools\Llvm\x64\bin;C:\Program Files\NASM;%CD%\ffi-prefix\bin;%ProgramData%\chocolatey\bin;%LOCALAPPDATA%\Microsoft\WinGet\Links;%PATH%"

          set CC=ccache clang
          set CXX=ccache clang++
          set CC_LD=lld-link
          set CXX_LD=lld-link
          set WINDRES=llvm-rc

          set PKG_CONFIG_PATH=%CD%\ffi-prefix\lib\pkgconfig
          set CMAKE_PREFIX_PATH=%CD%\ffi-prefix
          set INCLUDE=%CD%\ffi-prefix\include;%INCLUDE%
          set LIB=%CD%\ffi-prefix\lib;%LIB%

          where clang
          clang --version
          where pkg-config
          pkg-config --exists --print-errors vpl
          if errorlevel 1 exit /b 1

          rem shared libmpv.dll + static deps (upstream uses static default_library)
          python ci\ffi\patch-libmpv-shared.py
          if errorlevel 1 exit /b 1

          rem Pre-clone ffmpeg so we can fix qsv deps_any(libmfx|libvpl) before meson configures
          if not exist subprojects\ffmpeg (
            git clone --depth 1 --branch meson-8.1 --recurse-submodules https://gitlab.freedesktop.org/gstreamer/meson-ports/ffmpeg.git subprojects\ffmpeg
            if errorlevel 1 exit /b 1
          )
          python ci\ffi\patch-ffmpeg-qsv-libvpl.py
          if errorlevel 1 exit /b 1

          if exist build-ffi rmdir /s /q build-ffi

          meson setup build-ffi ^
            --prefix=%CD%\ffi-prefix ^
            --libdir=lib ^
            --wrap-mode=forcefallback ^
            --default-library=static ^
            --buildtype=release ^
            -Db_vscrt=mt ^
            -Dlibmpv=true ^
            -Dcplayer=false ^
            -Dtests=false ^
            -Dgpl=true ^
            -Dd3d11=enabled ^
            -Dwasapi=enabled ^
            -Dshaderc=enabled ^
            -Dspirv-cross=enabled ^
            -Djavascript=disabled ^
            -Dlua=disabled ^
            -Dsubrandr=disabled ^
            -Dlibarchive=disabled ^
            -Dvapoursynth=disabled ^
            -Drubberband=disabled ^
            -Dlibbluray=disabled ^
            -Ddvdnav=disabled ^
            -Dcdda=disabled ^
            -Duchardet=disabled ^
            -Dzimg=disabled ^
            -Djpeg=disabled ^
            -Dlcms2=disabled ^
            -Dlibavdevice=disabled ^
            -Dlibcurl=disabled ^
            -Diconv=disabled ^
            -Dcuda-hwaccel=disabled ^
            -Dcuda-interop=disabled ^
            -Dd3d-hwaccel=disabled ^
            -Dd3d9-hwaccel=disabled ^
            -Damf=disabled ^
            -Dvulkan=disabled ^
            -Dgl=disabled ^
            -Degl=disabled ^
            -Degl-angle=disabled ^
            -Dplain-gl=disabled ^
            -Dwayland=disabled ^
            -Dx11=disabled ^
            -Ddrm=disabled ^
            -Dvaapi=disabled ^
            -Dvdpau=disabled ^
            -Dwin32-smtc=disabled ^
            -Dlibplacebo:demos=false ^
            -Dlibplacebo:tests=false ^
            -Dlibplacebo:vulkan=disabled ^
            -Dlibplacebo:opengl=disabled ^
            -Dlibplacebo:d3d11=enabled ^
            -Dlibplacebo:shaderc=enabled ^
            -Dlibplacebo:lcms=disabled ^
            -Dlibass:test=disabled ^
            -Dharfbuzz:freetype=enabled ^
            -Dxxhash:inline-all=true ^
            -Dxxhash:cli=false ^
            -Dffmpeg:gpl=enabled ^
            -Dffmpeg:tests=disabled ^
            -Dffmpeg:programs=disabled ^
            -Dffmpeg:sdl2=disabled ^
            -Dffmpeg:network=enabled ^
            -Dffmpeg:libvpl=enabled ^
            -Dffmpeg:libmfx=disabled ^
            -Dffmpeg:libdav1d=disabled ^
            -Dffmpeg:libaom=disabled ^
            -Dffmpeg:libjxl=disabled ^
            -Dffmpeg:ffnvcodec=disabled ^
            -Dffmpeg:vulkan=disabled ^
            -Dffmpeg:h264_qsv_decoder=enabled ^
            -Dffmpeg:aac_decoder=enabled ^
            -Dffmpeg:h264_decoder=disabled ^
            -Dffmpeg:hevc_decoder=disabled ^
            -Dffmpeg:vvc_decoder=disabled ^
            -Dffmpeg:av1_decoder=disabled ^
            -Dffmpeg:vp9_decoder=disabled ^
            -Dffmpeg:vp8_decoder=disabled ^
            -Dffmpeg:hevc_qsv_decoder=disabled ^
            -Dffmpeg:av1_qsv_decoder=disabled ^
            -Dffmpeg:vp8_qsv_decoder=disabled ^
            -Dffmpeg:vp9_qsv_decoder=disabled ^
            -Dffmpeg:mpeg2_qsv_decoder=disabled ^
            -Dffmpeg:mjpeg_qsv_decoder=disabled ^
            -Dffmpeg:vc1_qsv_decoder=disabled ^
            -Dffmpeg:vvc_qsv_decoder=disabled ^
            -Dffmpeg:h264_cuvid_decoder=disabled ^
            -Dffmpeg:h264_amf_decoder=disabled ^
            -Dffmpeg:libdav1d_decoder=disabled ^
            -Dffmpeg:libaom_av1_decoder=disabled ^
            -Dffmpeg:h264_qsv_encoder=disabled ^
            -Dffmpeg:hevc_qsv_encoder=disabled ^
            -Dffmpeg:av1_qsv_encoder=disabled ^
            -Dffmpeg:h264_nvenc_encoder=disabled ^
            -Dffmpeg:h264_amf_encoder=disabled ^
            -Dffmpeg:h264_parser=enabled ^
            -Dffmpeg:aac_parser=enabled ^
            -Dffmpeg:h264_mp4toannexb_bsf=enabled ^
            -Dffmpeg:aac_adtstoasc_bsf=enabled ^
            -Dffmpeg:extract_extradata_bsf=enabled ^
            -Dffmpeg:mov_demuxer=enabled ^
            -Dffmpeg:mpegts_demuxer=enabled ^
            -Dffmpeg:dash_demuxer=enabled ^
            -Dffmpeg:aac_demuxer=enabled ^
            -Dffmpeg:h264_demuxer=enabled ^
            -Dffmpeg:file_protocol=enabled ^
            -Dffmpeg:http_protocol=enabled ^
            -Dffmpeg:https_protocol=enabled ^
            -Dffmpeg:tcp_protocol=enabled ^
            -Dffmpeg:tls_protocol=enabled ^
            -Dffmpeg:crypto_protocol=enabled ^
            -Dffmpeg:aresample_filter=enabled ^
            -Dffmpeg:aformat_filter=enabled ^
            -Dffmpeg:format_filter=enabled ^
            -Dffmpeg:scale_filter=enabled ^
            -Dffmpeg:hwdownload_filter=enabled ^
            -Dffmpeg:hwupload_filter=enabled ^
            -Dffmpeg:hwmap_filter=enabled ^
            -Dffmpeg:h264_d3d11va_hwaccel=disabled ^
            -Dffmpeg:h264_d3d11va2_hwaccel=disabled ^
            -Dffmpeg:h264_d3d12va_hwaccel=disabled ^
            -Dffmpeg:h264_dxva2_hwaccel=disabled ^
            -Dffmpeg:h264_nvdec_hwaccel=disabled ^
            -Dffmpeg:h264_vulkan_hwaccel=disabled
          if errorlevel 1 exit /b 1

          rem Fail early if depgraph patch did not take effect
          findstr /C:"#define CONFIG_H264_QSV_DECODER 1" build-ffi\subprojects\ffmpeg\config_components.h
          if errorlevel 1 (
            echo CONFIG_H264_QSV_DECODER is not 1
            findstr /C:"CONFIG_H264_QSV" /C:"CONFIG_QSVDEC" build-ffi\subprojects\ffmpeg\config_components.h
            findstr /C:"CONFIG_QSV" /C:"CONFIG_LIBVPL" build-ffi\subprojects\ffmpeg\config.h
            exit /b 1
          )
          findstr /C:"#define CONFIG_QSV 1" build-ffi\subprojects\ffmpeg\config.h
          if errorlevel 1 (
            echo CONFIG_QSV is not 1
            findstr /C:"CONFIG_QSV" build-ffi\subprojects\ffmpeg\config.h
            exit /b 1
          )
          findstr /C:"#define CONFIG_LIBVPL 1" build-ffi\subprojects\ffmpeg\config.h
          if errorlevel 1 (
            echo CONFIG_LIBVPL is not 1
            exit /b 1
          )

          rem Meson target name is "mpv" (shared_library('mpv') -> mpv-2.dll)
          meson compile -C build-ffi mpv
          if errorlevel 1 exit /b 1

      - name: Print meson log on failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          if exist build-ffi\meson-logs\meson-log.txt (
            more +0 build-ffi\meson-logs\meson-log.txt
          )

      - name: Package artifact
        run: |
          call "%VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if exist ffi-out rmdir /s /q ffi-out
          mkdir ffi-out

          set FOUND=
          for /r build-ffi %%f in (mpv-*.dll) do (
            copy /Y "%%f" ffi-out\libmpv-2.dll
            set FOUND=1
            goto :copied
          )
          for /r build-ffi %%f in (mpv.dll) do (
            copy /Y "%%f" ffi-out\libmpv-2.dll
            set FOUND=1
            goto :copied
          )
          :copied
          if not exist ffi-out\libmpv-2.dll (
            echo libmpv DLL not found
            dir /s /b build-ffi\*.dll
            exit /b 1
          )

          if exist ffi-prefix\bin\libvpl.dll copy /Y ffi-prefix\bin\libvpl.dll ffi-out\
          del /q ffi-out\*.pdb 2>nul

          dumpbin /EXPORTS ffi-out\libmpv-2.dll | findstr /C:"mpv_create" /C:"mpv_initialize" /C:"mpv_command" /C:"mpv_set_property" /C:"mpv_get_property" /C:"mpv_wait_event" /C:"mpv_terminate_destroy"
          if errorlevel 1 (
            echo Missing required exports
            dumpbin /EXPORTS ffi-out\libmpv-2.dll
            exit /b 1
          )

          dumpbin /DEPENDENTS ffi-out\libmpv-2.dll | findstr /I /C:"libvpl.dll"
          if errorlevel 1 (
            echo libmpv-2.dll does not import libvpl.dll
            dumpbin /DEPENDENTS ffi-out\libmpv-2.dll
            exit /b 1
          )

          python ci\ffi\verify-libmpv-qsv.py ffi-out\libmpv-2.dll
          if errorlevel 1 exit /b 1

          dir ffi-out
          ccache -s

      - name: Artifact name
        id: artifact
        run: |
          echo name=libmpv-2-win-x64-msvc-%GITHUB_RUN_ID%>> %GITHUB_OUTPUT%

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ffi-out/*
            !ffi-out/*.pdb
          if-no-files-found: error

      - name: Save caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .ccache
            ffi-prefix
            subprojects/libvpl
            subprojects/shaderc_cmake
            subprojects/spirv-cross-src
            subprojects/ffmpeg
          key: buildffi-x64-${{ steps.get_time.outputs.timestamp }}
